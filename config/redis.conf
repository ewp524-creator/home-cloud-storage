bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
pidfile @FILEHOME_ROOT@/.redis-data/redis.pid
loglevel notice
logfile @FILEHOME_ROOT@/logs/redis.log

databases 16
maxclients 1000
save 900 1
save 300 10
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir @FILEHOME_ROOT@/.redis-data

appendonly no
maxmemory 256mb
maxmemory-policy allkeys-lru
