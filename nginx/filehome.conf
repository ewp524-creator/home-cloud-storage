worker_processes 1;

error_log @FILEHOME_ROOT@/nginx/nginx-1.30.6/logs/filehome-error.log warn;
pid @FILEHOME_ROOT@/nginx/nginx-1.30.6/logs/filehome-nginx.pid;

events {
    worker_connections 2048;
}

http {
    include @FILEHOME_ROOT@/nginx/nginx-1.30.6/conf/mime.types;
    default_type application/octet-stream;

    log_format filehome '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
    access_log @FILEHOME_ROOT@/nginx/nginx-1.30.6/logs/filehome-access.log filehome;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5g;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream filehome_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:80;
        server_name localhost;

        root @FILEHOME_ROOT@/frontend/dist;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

        location /api/ {
            proxy_pass http://filehome_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_connect_timeout 15s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_force_ranges on;
            proxy_hide_header Server;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /terminal {
            return 410;
        }

        location ^~ /terminal/ {
            return 410;
        }

        location ^~ /terminal-api/ {
            return 410;
        }

        location = /terminal-ws {
            return 410;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
